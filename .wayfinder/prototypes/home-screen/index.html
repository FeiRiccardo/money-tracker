<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE - Home screen (throwaway)</title>
<!--
  PROTOTYPE, THROWAWAY. Wayfinder ticket: "Home screen prototype".
  Question: what should the phone home screen look and behave like?
  Plan: three structurally different variants (A, B, C) on one page, switchable with
  the bar at the bottom, the arrow keys, or ?variant=A|B|C. Double-click to open.
  Everything is in memory: reload resets the demo data. Fake "today" is 2026-10-18.
  Behaviour follows the closed tickets: "+" opens one form (amount first, Expense default,
  date today), chip picker for the chosen type, at least one Category required, tap a row
  to edit, delete only inside the edit form with a 5s Undo toast, Retired labels stay on
  old Transactions as greyed chips (try the "Gym" transactions), summary shows overlapping
  per-Category totals separately from the real month total.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#d9dde3;color:#111;display:flex;justify-content:center;align-items:flex-start;padding:12px 0 64px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.phone{position:relative;width:390px;max-width:100%;height:min(844px,calc(100dvh - 84px));background:var(--bg);color:var(--fg);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
@media(max-width:500px){body{padding:0 0 56px}.phone{border-radius:0;height:calc(100dvh - 56px)}}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.muted{color:var(--mut)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--chipbg);color:var(--fg)}
.tag.ret,.chip.ret{background:transparent;border:1px dashed var(--mut);color:var(--mut);font-style:italic}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;cursor:pointer}
.row .t{font-weight:500}
.row .tags{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mut);padding:8px 16px 12px}
.bar{display:flex;align-items:center;gap:8px}
.bar .barfill{height:8px;border-radius:4px;background:var(--acc)}
/* Variant themes */
.vA{--bg:#f6f7f9;--fg:#111;--mut:#6b7280;--acc:#2563eb;--inc:#15803d;--exp:#b91c1c;--card:#fff;--line:#e5e7eb;--chipbg:#eceef2}
.vB{--bg:#fbf7f1;--fg:#1c1917;--mut:#78716c;--acc:#0f766e;--inc:#0f766e;--exp:#c2410c;--card:#fff;--line:#eadfce;--chipbg:#efe7da}
.vC{--bg:#0d0e12;--fg:#f4f4f5;--mut:#8b8d98;--acc:#e5e7eb;--inc:#4ade80;--exp:#fb7185;--card:#17181e;--line:#23252d;--chipbg:#23252d}
/* shared form bits */
.seg{display:inline-flex;background:var(--chipbg);border-radius:99px;padding:3px}
.seg button{padding:6px 16px;border-radius:99px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;background:var(--chipbg);font-weight:500}
.chip.sel{background:var(--acc);color:#fff}
.vC .chip.sel{color:#000}
.chip.add{border:1px dashed var(--mut);background:transparent;color:var(--mut)}
.err{color:var(--exp);font-size:13px;margin-top:6px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:16px 0 8px}
.more{display:flex;gap:10px;margin-top:14px}
.more label{flex:1;display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
.more input,.newcat input{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.newcat{display:flex;gap:8px;margin-top:10px}.newcat input{flex:1}
.save{width:100%;margin-top:18px;padding:14px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
.vC .save{color:#000}
.save:disabled{opacity:.35;cursor:not-allowed}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fh .x{font-size:20px;padding:4px 8px;color:var(--mut)}
.fh .del{color:var(--exp);font-weight:600;padding:4px 8px}
.amtbox{display:flex;align-items:baseline;gap:6px;margin-top:18px;font-size:40px;font-weight:700}
.amtbox input{width:100%;border:0;outline:0;background:transparent;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.ovl{position:absolute;inset:0;background:var(--bg);padding:18px 16px 24px;overflow-y:auto;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px 22px;z-index:21;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.toast{position:absolute;left:12px;right:12px;bottom:78px;background:#111;color:#fff;padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;z-index:40}
.toast button{color:#7dd3fc;font-weight:700}
/* A */
.A-head{padding:16px 16px 8px}
.A-month{display:flex;align-items:center;justify-content:space-between}
.A-month button{font-size:22px;padding:2px 12px;color:var(--mut)}
.A-bal{margin-top:6px}.A-bal small{color:var(--mut)}.A-bal b{display:block;font-size:34px;font-variant-numeric:tabular-nums}
.A-tabs{display:flex;margin:10px 16px 0;border-bottom:1px solid var(--line)}
.A-tabs button{flex:1;padding:10px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent}
.A-tabs button.on{color:var(--acc);border-color:var(--acc)}
.A-day{position:sticky;top:0;background:var(--bg);padding:8px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.A-list .row{background:var(--card);border-bottom:1px solid var(--line)}
.fab{position:absolute;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:32px;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:10;line-height:1}
.vC .fab{color:#000}
.A-sum{padding:12px 16px}
.A-sum .tot{display:flex;gap:8px;margin-bottom:14px}
.A-sum .tot div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.A-sum .tot small{display:block;color:var(--mut);font-size:12px}
.catrow{margin:10px 0}
.catrow .h{display:flex;justify-content:space-between;margin-bottom:4px}
/* B */
.B-hero{margin:14px 14px 0;background:var(--acc);color:#fff;border-radius:22px;padding:16px}
.B-hero .m{display:flex;justify-content:space-between;align-items:center}
.B-hero .m button{color:#fff;font-size:20px;padding:2px 10px}
.B-hero .net{font-size:34px;font-weight:700;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.B-hero .two{display:flex;gap:10px}
.B-hero .two div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.B-hero small{opacity:.85;font-size:12px;display:block}
.B-card{margin:14px 14px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.B-card h3{font-size:14px;margin-bottom:6px}
.B-tabbar{display:flex;align-items:center;justify-content:space-around;height:62px;background:var(--card);border-top:1px solid var(--line);flex:none}
.B-tabbar .tab{flex:1;color:var(--mut);font-weight:600}
.B-tabbar .tab.on{color:var(--acc)}
.B-tabbar .plus{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;margin-top:-22px;box-shadow:0 5px 14px rgba(0,0,0,.25);line-height:1}
.B-row{border-bottom:1px solid var(--line)}
.B-all{padding:6px 0 14px}
/* C */
.C-top{padding:26px 20px 8px;text-align:center}
.C-top small{color:var(--mut)}
.C-top b{display:block;font-size:46px;letter-spacing:-.02em;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.C-pill{display:inline-flex;gap:10px;align-items:center;background:var(--card);border-radius:99px;padding:7px 14px;color:var(--mut)}
.C-pill b{display:inline;font-size:14px;margin:0;letter-spacing:0;color:var(--fg)}
.C-list{padding:8px 8px 90px}
.C-list .row{border-radius:14px}
.C-list .row:active{background:var(--card)}
.C-dayh{padding:14px 16px 4px;font-size:12px;color:var(--mut)}
.sumsheet{position:absolute;left:0;right:0;bottom:0;top:90px;background:var(--card);border-radius:22px 22px 0 0;z-index:21;padding:16px;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.keypad button{padding:16px 0;font-size:24px;border-radius:14px;background:var(--card)}
.keypad button.go{background:var(--acc);color:#000;font-weight:700;font-size:17px}
.keypad button:disabled{opacity:.3}
.cdisp{text-align:center;font-size:54px;font-weight:700;margin:14px 0 6px;font-variant-numeric:tabular-nums}
.cdisp.empty{color:var(--mut)}
.C-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:10px}
.C-chips .chip{flex:none}
/* switcher */
#switcher{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#111;color:#fff;padding:8px 10px;border-radius:99px;box-shadow:0 4px 18px rgba(0,0,0,.4);z-index:1000;font-size:14px;font-weight:600}
#switcher button{background:#2d2d33;color:#fff;border-radius:50%;width:32px;height:32px;font-size:16px}
#switcher span{min-width:150px;text-align:center}
</style>
</head>
<body>
<div id="app" class="phone vA"></div>
<div id="switcher"><button id="prev" aria-label="previous variant">&#8592;</button><span id="vlabel"></span><button id="next" aria-label="next variant">&#8594;</button></div>
<script>
const TODAY='2026-10-18';
const VARIANTS={A:'Ledger list',B:'Dashboard first',C:'Keypad minimal'};
let variant=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();
if(!VARIANTS[variant])variant='A';

let nid=100;
const S={
  opening:1200,month:'2026-10',tab:'list',home:'home',sheet:false,form:null,toast:null,
  cats:{expense:['Groceries','Dining out','Transport','Housing','Utilities','Health','Entertainment','Shopping','Other'],income:['Salary','Gifts','Other']},
  txs:[]
};
const T=(date,type,amount,cats,note)=>S.txs.push({id:++nid,date,type,amount,cats,note});
T('2026-10-18','expense',4.5,['Dining out'],'Coffee');
T('2026-10-17','expense',62.3,['Groceries','Shopping'],'Weekly shop + new pan');
T('2026-10-15','expense',35,['Gym'],'Monthly pass');
T('2026-10-12','income',1800,['Salary'],'October salary');
T('2026-10-10','expense',720,['Housing'],'Rent');
T('2026-10-08','expense',48.9,['Utilities'],'Electricity');
T('2026-10-06','expense',18,['Entertainment','Dining out'],'Cinema + pizza');
T('2026-10-03','expense',12.4,['Transport'],'Train');
T('2026-10-02','income',50,['Gifts'],'Birthday');
T('2026-10-01','expense',27.6,['Groceries'],'');
T('2026-09-28','expense',55,['Groceries'],'');
T('2026-09-25','income',1800,['Salary'],'September salary');
T('2026-09-20','expense',720,['Housing'],'Rent');
T('2026-09-14','expense',35,['Gym'],'Monthly pass');
T('2026-09-09','expense',40,['Health'],'Pharmacy');

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'€'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel=m=>MONTHS[+m.slice(5)-1]+' '+m.slice(0,4);
const shiftMonth=d=>{let y=+S.month.slice(0,4),m=+S.month.slice(5)+d;if(m<1){m=12;y--}if(m>12){m=1;y++}S.month=y+'-'+String(m).padStart(2,'0')};
const dayLabel=d=>d===TODAY?'Today':new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const isRet=(type,name)=>!S.cats[type].includes(name);
const balance=()=>S.opening+S.txs.reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0);
const monthTxs=()=>S.txs.filter(t=>t.date.startsWith(S.month)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
function summary(){
  const r={inc:0,exp:0,cat:{expense:{},income:{}}};
  for(const t of monthTxs()){
    r[t.type==='income'?'inc':'exp']+=t.amount;
    for(const c of t.cats){const o=r.cat[t.type][c]||(r.cat[t.type][c]={sum:0,n:0,ret:isRet(t.type,c)});o.sum+=t.amount;o.n++}
  }
  r.net=r.inc-r.exp;
  for(const k of['expense','income'])r.cat[k]=Object.entries(r.cat[k]).sort((a,b)=>b[1].sum-a[1].sum);
  return r;
}
function parseAmt(s){s=String(s).trim().replace(',','.');return /^\d+(\.\d{1,2})?$/.test(s)&&+s>0?+s:null}

/* ---------- form state + logic (shared by all variants) ---------- */
function openForm(id){
  if(id){const t=S.txs.find(x=>x.id===id);
    S.form={id,type:t.type,amt:String(t.amount).replace('.',','),date:t.date,note:t.note,
      sel:t.cats.filter(c=>!isRet(t.type,c)),ret:t.cats.filter(c=>isRet(t.type,c)),err:'',addOpen:false,focus:true,orig:t};
  }else S.form={id:null,type:'expense',amt:'',date:TODAY,note:'',sel:[],ret:[],err:'',addOpen:false,focus:true};
}
const canSave=()=>S.form&&parseAmt(S.form.amt)!==null&&(S.form.sel.length+S.form.ret.length)>0;
function saveForm(){
  if(!canSave())return;const f=S.form;
  const tx={id:f.id||++nid,date:f.date||TODAY,type:f.type,amount:parseAmt(f.amt),cats:f.ret.concat(f.sel),note:f.note.trim()};
  if(f.id){S.txs[S.txs.findIndex(x=>x.id===f.id)]=tx}else S.txs.push(tx);
  const l=S.cats[f.type];for(const c of f.sel.slice().reverse()){l.splice(l.indexOf(c),1);l.unshift(c)}
  S.month=tx.date.slice(0,7);S.form=null;
}
function deleteForm(){
  const f=S.form,t=S.txs.find(x=>x.id===f.id);S.txs=S.txs.filter(x=>x.id!==f.id);S.form=null;
  clearTimeout(S.tt);S.toast={msg:'Transaction deleted',undo:()=>{S.txs.push(t);S.month=t.date.slice(0,7)}};
  S.tt=setTimeout(()=>{S.toast=null;render()},5000);
}
function addCat(){
  const f=S.form,el=$('#newname'),name=(el?el.value:'').trim();
  if(!name)return;
  const all=S.cats[f.type].concat(S.txs.filter(t=>t.type===f.type).flatMap(t=>t.cats));
  if(name.length>30)f.err='Max 30 characters.';
  else if(name.includes('|'))f.err='The "|" character is not allowed.';
  else if(all.some(c=>c.toLowerCase()===name.toLowerCase()))f.err='That name is already used (retired names stay reserved).';
  else{S.cats[f.type].unshift(name);f.sel.push(name);f.err='';f.addOpen=false}
}
function keypad(k){
  const f=S.form;let a=f.amt;
  if(k==='<')a=a.slice(0,-1);
  else if(k===','){if(!a.includes(','))a=(a||'0')+','}
  else{const d=a.split(',')[1];if(!(d&&d.length>=2)&&a.length<9)a+=k}
  f.amt=a;
}

/* ---------- shared view pieces (small) ---------- */
const tagsHTML=t=>t.cats.map(c=>`<span class="tag ${isRet(t.type,c)?'ret':''}">${esc(c)}</span>`).join('');
const amtHTML=t=>`<div class="amt ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div>`;
const rowHTML=(t,cls='')=>`<div class="row ${cls}" data-act="edit" data-id="${t.id}"><div><div class="t">${esc(t.note||t.cats[0])}</div><div class="tags">${tagsHTML(t)}</div></div>${amtHTML(t)}</div>`;
const catBars=(list,sign)=>{const max=Math.max(1,...list.map(x=>x[1].sum));
  return list.map(([n,o])=>`<div class="catrow"><div class="h"><span>${esc(n)} ${o.ret?'<span class="tag ret">retired</span>':''} <span class="muted">· ${o.n}</span></span><span class="amt">${money(o.sum)}</span></div><div class="bar"><div class="barfill" style="width:${o.sum/max*100}%"></div></div></div>`).join('')||'<div class="muted">Nothing this month.</div>'};
const OVERLAP='Categories overlap: a Transaction counts in each of its Categories, so these lines add up to more than the real total above.';

/* ---------- form views ---------- */
function typeSeg(){const f=S.form;return `<div class="seg"><button class="${f.type==='expense'?'on':''}" data-act="type" data-v="expense">Expense</button><button class="${f.type==='income'?'on':''}" data-act="type" data-v="income">Income</button></div>`}
function chipsHTML(){
  const f=S.form;
  return f.ret.map(c=>`<button class="chip sel ret" data-act="rcat" data-name="${esc(c)}" title="Retired label, tap to remove">${esc(c)} ✕</button>`).join('')+
    S.cats[f.type].map(c=>`<button class="chip ${f.sel.includes(c)?'sel':''}" data-act="cat" data-name="${esc(c)}">${esc(c)}</button>`).join('')+
    `<button class="chip add" data-act="newcat">+ New</button>`;
}
function newCatBox(){const f=S.form;return (f.addOpen?`<div class="newcat"><input id="newname" maxlength="40" placeholder="New ${f.type} Category"><button class="chip sel" data-act="addcat">Add</button></div>`:'')+(f.err?`<div class="err">${esc(f.err)}</div>`:'')}
function dateNote(){const f=S.form;return `<div class="more"><label>Date<input type="date" value="${f.date}" data-in="date"></label><label>Note (optional)<input type="text" value="${esc(f.note)}" data-in="note" placeholder="e.g. Coffee"></label></div>`}
function formStandard(){
  const f=S.form;
  return `<div class="fh"><button class="x" data-act="cancel" aria-label="close">✕</button>${typeSeg()}${f.id?'<button class="del" data-act="del">Delete</button>':'<span style="width:56px"></span>'}</div>
  <div class="amtbox"><span class="muted">€</span><input id="amt" inputmode="decimal" placeholder="0.00" value="${esc(f.amt)}" data-in="amt" autocomplete="off"></div>
  <div class="lbl">Categories <span style="text-transform:none;letter-spacing:0">(pick one or more)</span></div>
  <div class="chips">${chipsHTML()}</div>${newCatBox()}${dateNote()}
  <button class="save" data-act="save" ${canSave()?'':'disabled'}>${f.id?'Save changes':'Save'}</button>`;
}
function formKeypad(){
  const f=S.form;
  const keys=['1','2','3','4','5','6','7','8','9',',','0','<'].map(k=>`<button data-act="key" data-k="${k}">${k==='<'?'⌫':k}</button>`).join('');
  return `<div class="fh"><button class="x" data-act="cancel" aria-label="close">✕</button>${typeSeg()}${f.id?'<button class="del" data-act="del">Delete</button>':'<span style="width:56px"></span>'}</div>
  <div class="cdisp ${f.amt?'':'empty'}">€${esc(f.amt||'0')}</div>
  <div class="C-chips">${chipsHTML()}</div>${newCatBox()}
  <details style="margin-top:10px"${f.note||f.date!==TODAY?' open':''}><summary class="muted" style="cursor:pointer">Date and note</summary>${dateNote()}</details>
  <div class="keypad">${keys}<button class="go" style="grid-column:1/-1" data-act="save" ${canSave()?'':'disabled'}>${f.id?'Save changes':'Save'}</button></div>`;
}
const formHTML=()=>{
  if(!S.form)return '';
  if(variant==='A')return `<div class="ovl">${formStandard()}</div>`;
  if(variant==='B')return `<div class="backdrop" data-act="cancel"></div><div class="sheet">${formStandard()}</div>`;
  return `<div class="ovl">${formKeypad()}</div>`;
};
const toastHTML=()=>S.toast?`<div class="toast"><span>${esc(S.toast.msg)}</span><button data-act="undo">Undo</button></div>`:'';

/* ---------- Variant A: ledger list, summary on a second tab, full-screen form ---------- */
function viewA(){
  const sm=summary(),txs=monthTxs();let body='';
  if(S.tab==='list'){
    const days=[...new Set(txs.map(t=>t.date))];
    body=`<div class="A-list">`+(days.map(d=>{const net=txs.filter(t=>t.date===d).reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0);
      return `<div class="A-day"><span>${dayLabel(d)}</span><span>${net<0?'−':'+'}${money(Math.abs(net))}</span></div>`+txs.filter(t=>t.date===d).map(t=>rowHTML(t)).join('')}).join('')||'<div class="note">No Transactions this month. Tap + to add one.</div>')+`</div>`;
  }else{
    body=`<div class="A-sum"><div class="tot"><div><small>Income</small><b class="inc amt">${money(sm.inc)}</b></div><div><small>Expenses</small><b class="exp amt">${money(sm.exp)}</b></div><div><small>Net</small><b class="amt">${money(sm.net)}</b></div></div>
    <h4 style="margin:6px 0 2px">Expenses by Category</h4>${catBars(sm.cat.expense)}<h4 style="margin:18px 0 2px">Income by Category</h4>${catBars(sm.cat.income)}<p class="muted" style="font-size:12.5px;margin-top:14px">${OVERLAP}</p></div>`;
  }
  return `<div class="A-head"><div class="A-month"><button data-act="mprev">‹</button><b>${monthLabel(S.month)}</b><button data-act="mnext">›</button></div>
  <div class="A-bal"><small>Balance</small><b>${money(balance())}</b></div></div>
  <div class="A-tabs"><button class="${S.tab==='list'?'on':''}" data-act="tab" data-v="list">Transactions</button><button class="${S.tab==='sum'?'on':''}" data-act="tab" data-v="sum">Summary</button></div>
  <div class="scroll">${body}</div><button class="fab" data-act="fab" aria-label="add">+</button>`;
}

/* ---------- Variant B: month dashboard first, tab bar with centre +, bottom-sheet form ---------- */
function viewB(){
  const sm=summary(),txs=monthTxs();let body='';
  if(S.home==='home'){
    body=`<div class="B-hero"><div class="m"><button data-act="mprev">‹</button><b>${monthLabel(S.month)}</b><button data-act="mnext">›</button></div>
      <small style="opacity:.85">Net this month</small><div class="net">${sm.net<0?'−':''}${money(Math.abs(sm.net))}</div>
      <div class="two"><div><small>Income</small><b>${money(sm.inc)}</b></div><div><small>Expenses</small><b>${money(sm.exp)}</b></div></div>
      <small style="margin-top:10px">Total balance ${money(balance())}</small></div>
    <div class="B-card"><h3>Spending by Category</h3>${catBars(sm.cat.expense)}<p class="muted" style="font-size:12px;margin-top:8px">${OVERLAP}</p></div>
    <div class="B-card"><h3>Latest</h3>${txs.slice(0,4).map(t=>rowHTML(t,'B-row')).join('')||'<div class="muted">No Transactions this month.</div>'}</div><div style="height:16px"></div>`;
  }else{
    body=`<div class="B-all"><div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px"><button data-act="mprev" style="font-size:20px;padding:0 10px">‹</button><b>${monthLabel(S.month)}</b><button data-act="mnext" style="font-size:20px;padding:0 10px">›</button></div>${txs.map(t=>rowHTML(t,'B-row')).join('')||'<div class="note">No Transactions this month.</div>'}</div>`;
  }
  return `<div class="scroll">${body}</div>
  <div class="B-tabbar"><button class="tab ${S.home==='home'?'on':''}" data-act="home" data-v="home">Overview</button><button class="plus" data-act="fab" aria-label="add">+</button><button class="tab ${S.home==='all'?'on':''}" data-act="home" data-v="all">All</button></div>`;
}

/* ---------- Variant C: dark, one big number, plain list, summary in a sheet, keypad form ---------- */
function viewC(){
  const sm=summary(),txs=monthTxs();
  const days=[...new Set(txs.map(t=>t.date))];
  const list=days.map(d=>`<div class="C-dayh">${dayLabel(d)}</div>`+txs.filter(t=>t.date===d).map(t=>rowHTML(t)).join('')).join('')||'<div class="note">Nothing here yet. Tap + to add your first Transaction.</div>';
  const sheet=S.sheet?`<div class="backdrop" data-act="sheet"></div><div class="sumsheet"><div style="display:flex;justify-content:space-between;align-items:center"><b>${monthLabel(S.month)}</b><button data-act="sheet" class="muted">Close</button></div>
    <div style="display:flex;gap:10px;margin:12px 0"><div style="flex:1"><small class="muted">Income</small><div class="amt inc">${money(sm.inc)}</div></div><div style="flex:1"><small class="muted">Expenses</small><div class="amt exp">${money(sm.exp)}</div></div><div style="flex:1"><small class="muted">Net</small><div class="amt">${money(sm.net)}</div></div></div>
    <h4>Expenses by Category</h4>${catBars(sm.cat.expense)}<h4 style="margin-top:16px">Income by Category</h4>${catBars(sm.cat.income)}<p class="muted" style="font-size:12.5px;margin-top:12px">${OVERLAP}</p></div>`:'';
  return `<div class="C-top"><small>Balance</small><b>${money(balance())}</b>
    <span class="C-pill"><button data-act="mprev">‹</button><span>${monthLabel(S.month)}</span><button data-act="mnext">›</button><button data-act="sheet" style="color:var(--fg)"><b>Summary ↗</b></button></span></div>
  <div class="scroll C-list">${list}</div><button class="fab" data-act="fab" aria-label="add">+</button>${sheet}`;
}

/* ---------- render + events ---------- */
function render(){
  const app=$('#app');app.className='phone v'+variant;
  app.innerHTML=(variant==='A'?viewA():variant==='B'?viewB():viewC())+formHTML()+toastHTML();
  $('#vlabel').textContent=variant+' ('+VARIANTS[variant]+')';
  if(S.form&&S.form.focus){S.form.focus=false;if(variant!=='C'){const a=$('#amt');if(a)a.focus()}}
}
function setVariant(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);S.form=null;S.sheet=false;render()}
const order=Object.keys(VARIANTS);
const step=d=>setVariant(order[(order.indexOf(variant)+d+order.length)%order.length]);
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,[contenteditable]')){if(e.key==='Enter'&&e.target.id==='newname'){addCat();render()}return}
  if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k||!S.form)return;
  S.form[k]=e.target.value;const b=document.querySelector('[data-act=save]');if(b)b.disabled=!canSave();
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.closest('#switcher'))return;
  const a=el.dataset.act,f=S.form;
  if(a==='mprev')shiftMonth(-1);else if(a==='mnext')shiftMonth(1);
  else if(a==='tab')S.tab=el.dataset.v;else if(a==='home')S.home=el.dataset.v;
  else if(a==='sheet')S.sheet=!S.sheet;
  else if(a==='fab')openForm(null);
  else if(a==='edit')openForm(+el.dataset.id);
  else if(a==='cancel')S.form=null;
  else if(a==='type'){if(f.type!==el.dataset.v){f.type=el.dataset.v;f.sel=[];f.ret=[];f.err='';f.addOpen=false}}
  else if(a==='cat'){const n=el.dataset.name;f.sel=f.sel.includes(n)?f.sel.filter(x=>x!==n):f.sel.concat(n);f.err=''}
  else if(a==='rcat')f.ret=f.ret.filter(x=>x!==el.dataset.name);
  else if(a==='newcat'){f.addOpen=!f.addOpen;f.err=''}
  else if(a==='addcat'){addCat()}
  else if(a==='key')keypad(el.dataset.k);
  else if(a==='save')saveForm();
  else if(a==='del')deleteForm();
  else if(a==='undo'){S.toast.undo();S.toast=null;clearTimeout(S.tt)}
  render();
  if(a==='newcat'&&S.form&&S.form.addOpen){const n=$('#newname');if(n)n.focus()}
});
render();
</script>
</body>
</html>
